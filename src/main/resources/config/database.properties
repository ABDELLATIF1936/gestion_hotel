# Configuration de la base de données MySQL
# Modifier ces valeurs selon votre environnement

# URL de connexion à la base de données
db.url=jdbc:mysql://localhost:3307/gestion_hotel?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Nom d'utilisateur
db.username=root

# Mot de passe
db.password=root123

# Driver JDBC
db.driver=com.mysql.cj.jdbc.Driver

# Configuration du pool de connexions HikariCP
db.pool.minSize=5
db.pool.maxSize=20
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000

# Paramètres de connexion supplémentaires
db.autoReconnect=true
db.useUnicode=true
db.characterEncoding=UTF-8

